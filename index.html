<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/rohr-icon.svg" />
    <link rel="apple-touch-icon" href="/rohr-icon.svg" />
    <title class="notranslate" translate="no">ROHR Financial | Prêt personnel et crédit en ligne rapide</title>
    <meta name="description" content="Plateforme d'offres de prêt en ligne moderne, rapide et sécurisée par ROHR Financial." />
    <meta property="og:title" content="ROHR Financial | Prêt personnel et crédit en ligne rapide" />
    <meta property="og:description" content="Plateforme d'offres de prêt en ligne moderne, rapide et sécurisée par ROHR Financial." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* Neutralisation totale et définitive de tout pop-up, bannière, infobulle Google Translate */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      body > .skiptranslate,
      #goog-gt-tt,
      #goog-gt-vt,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover,
      .VIpgJd-yAWneB-L7tpub,
      .VIpgJd-yAWneB-L7tpub-pvdH9,
      .VIpgJd-yAWneB-hvhgNd,
      .VIpgJd-yAWneB-r9Qyie,
      .VIpgJd-ZVi9od-aZ2wEe,
      .VIpgJd-ZVi9od-aZ2wEe-OiiCO,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-ZVi9od-ORHb-OEVmcd-ti6hGc,
      .VIpgJd-ZVi9od-xl07Ob-OEVmcd,
      #google_translate_element,
      iframe[id^=":"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        border: none !important;
        z-index: -9999 !important;
      }

      body {
        top: 0px !important;
        position: static !important;
      }

      .goog-text-highlight {
        background: transparent !important;
        background-color: transparent !important;
        box-shadow: none !important;
        border: none !important;
        cursor: inherit !important;
      }
    </style>
  </head>
  <body class="font-sans antialiased text-slate-900 bg-slate-50">
    <div id="root"></div>
    
    <!-- Conteneur Google Translate (masqué pour préserver le design intact) -->
    <div id="google_translate_element" style="display:none;" aria-hidden="true"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'fr',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }

      // Neutralisation dynamique continue des pop-ups et bannières injectés
      (function() {
        function removeGooglePopups() {
          if (document.body && document.body.style.top && document.body.style.top !== '0px') {
            document.body.style.setProperty('top', '0px', 'important');
          }
          var targets = document.querySelectorAll(
            '#goog-gt-tt, #goog-gt-vt, .goog-te-balloon-frame, .VIpgJd-yAWneB-L7tpub, .VIpgJd-yAWneB-hvhgNd, .VIpgJd-ZVi9od-ORHb-OEVmcd, iframe.goog-te-banner-frame, body > .skiptranslate'
          );
          targets.forEach(function(el) {
            if (el && el.id !== 'google_translate_element') {
              el.style.setProperty('display', 'none', 'important');
              el.style.setProperty('visibility', 'hidden', 'important');
              el.style.setProperty('opacity', '0', 'important');
              el.style.setProperty('pointer-events', 'none', 'important');
            }
          });
        }

        var observer = new MutationObserver(removeGooglePopups);
        document.addEventListener('DOMContentLoaded', function() {
          removeGooglePopups();
          if (document.body) {
            observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
          }
        });
      })();

      // Synchronisation de la langue choisie avant l'initialisation du moteur de traduction
      (function() {
        try {
          var preferred = localStorage.getItem('rohr_preferred_lang');
          if (preferred === 'fr') {
            document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; path=/;';
            if (window.location.hostname) {
              document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; path=/; domain=.' + window.location.hostname + ';';
            }
          } else if (preferred && preferred.length >= 2) {
            document.cookie = 'googtrans=/fr/' + preferred.toLowerCase() + '; path=/;';
          }
        } catch(e) {}
      })();
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
